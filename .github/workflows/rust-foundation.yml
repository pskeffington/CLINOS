name: Rust foundation (synthetic preflight)

on:
  push:
    branches:
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace
      - name: Synthetic positive preflight
        run: cargo run --bin clinos -- preflight tests/fixtures/synthetic-bundle.json
      - name: Ambiguous fixture must report unresolved
        run: cargo run --bin clinos -- preflight tests/fixtures/ambiguous-bundle.json | grep -q '"clinical_equivalence":"UNRESOLVED"'
